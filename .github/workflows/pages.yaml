name: GitHub Pages (test)

on:
  push:
    branches:
      - claude/asciflow-door-module-locm0t
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          sudo curl -fsSL -o /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazel

      - name: Build the site
        run: bazel build site/... --remote_cache= --bes_backend= --bes_results_url= && cp -r --dereference bazel-bin/site ./deploy
        timeout-minutes: 15

      # Publishing to the gh-pages branch auto-enables GitHub Pages for the
      # repository, which the workflow token isn't allowed to do via the API.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          force_orphan: true
